name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache libx11-dev libxcb1-dev libpng-dev xvfb xauth xdotool scrot
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-24.04-ccache-${{ github.sha }}
          restore-keys: ${{ runner.os }}-24.04-ccache-
      - run: make JOBS=2

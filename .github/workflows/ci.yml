name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Clang is the reference compiler; GCC stays supported.
          - compiler: clang
            cc: clang
            cxx: clang++
          - compiler: gcc
            cc: gcc
            cxx: g++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache clang lld libx11-dev libxcb1-dev libpng-dev libgtk-3-dev libwayland-dev xvfb xauth xdotool imagemagick weston
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-24.04-${{ matrix.compiler }}-ccache-${{ github.sha }}
          restore-keys: ${{ runner.os }}-24.04-${{ matrix.compiler }}-ccache-
      - run: make JOBS=2
      - name: Report the compiler
        run: ${CXX} --version

name: Build and publish releases

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      description:
        description: 'Release notes (Markdown; optional)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      # The release artifacts are built with the reference compiler.
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7
      - name: Read project version
        id: version
        run: |
          version=$(sed -n 's/^[[:space:]]*VERSION \([0-9][0-9.]*\)$/\1/p' CMakeLists.txt | head -n1)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache clang lld libx11-dev libxcb1-dev libpng-dev libgtk-3-dev libwayland-dev rpm file cpio squashfs-tools librsvg2-bin xvfb xauth xdotool imagemagick weston desktop-file-utils
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-24.04-clang-ccache-${{ github.sha }}
          restore-keys: ${{ runner.os }}-24.04-clang-ccache-
      - name: Build and test
        run: make JOBS=2
      - name: Download appimagetool
        run: |
          curl --fail --location --retry 3 -o /tmp/appimagetool 'https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage'
          echo 'e8c1169c4af66c3184d7ee110713d4be04befe671fa358e2c1591ee840553b03  /tmp/appimagetool' | sha256sum -c -
          chmod +x /tmp/appimagetool
          curl --fail --location --retry 3 -o /tmp/appimage-runtime 'https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64'
          echo '617aa77314d57c8b8e4fae9c3f0b35af7b30d5529cb69e98f64f92510ed98a46  /tmp/appimage-runtime' | sha256sum -c -
          echo APPIMAGE_RUNTIME=/tmp/appimage-runtime >> "$GITHUB_ENV"
          echo /tmp >> "$GITHUB_PATH"
      - name: Package and smoke test
        run: |
          for format in source tar deb rpm appimage; do scripts/package.sh "$format"; done
          mkdir -p /tmp/deb-test /tmp/rpm-test /tmp/tar-test
          dpkg-deb -x build/artifacts/*.deb /tmp/deb-test
          /tmp/deb-test/usr/bin/loomwright --version
          (cd /tmp/rpm-test && rpm2cpio "$GITHUB_WORKSPACE"/build/artifacts/*.rpm | cpio -idm --quiet)
          /tmp/rpm-test/usr/bin/loomwright --version
          tar -xzf build/artifacts/*-x86_64.tar.gz -C /tmp/tar-test
          find /tmp/tar-test -type f -name loomwright -exec {} --version \;
          APPIMAGE_EXTRACT_AND_RUN=1 build/artifacts/*.AppImage --version
      - name: Check the desktop integration files
        run: |
          set -euo pipefail
          for root in /tmp/deb-test /tmp/rpm-test; do
            test -f "$root/usr/share/applications/io.github.noname_isaidnoname.loomwright.desktop"
            test -f "$root/usr/share/icons/hicolor/scalable/apps/loomwright.svg"
            test -f "$root/usr/share/mime/packages/loomwright.xml"
            test -f "$root/usr/share/metainfo/io.github.noname_isaidnoname.loomwright.metainfo.xml"
            test -x "$root/usr/bin/loomwright-terminal"
            desktop-file-validate "$root/usr/share/applications/io.github.noname_isaidnoname.loomwright.desktop"
          done
          desktop-file-validate packaging/common/io.github.noname_isaidnoname.loomwright.desktop
          desktop-file-validate packaging/appimage/io.github.noname_isaidnoname.loomwright.desktop
      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: build/artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  arch:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Arch build dependencies
        run: |
          pacman -Syu --noconfirm --needed git cmake ninja pkgconf clang libx11 libxcb libpng gtk3 wayland ccache desktop-file-utils shared-mime-info xdg-utils hicolor-icon-theme
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: /tmp/loomwright-ccache
          key: arch-x86_64-clang-ccache-${{ github.sha }}
          restore-keys: arch-x86_64-clang-ccache-
      - name: Build Arch package as an unprivileged user
        run: |
          useradd --create-home loomwright-builder
          mkdir -p /tmp/loomwright-ccache /tmp/loomwright-artifacts
          chown -R loomwright-builder:loomwright-builder /tmp/loomwright-ccache /tmp/loomwright-artifacts
          runuser -u loomwright-builder -- env CC=clang CXX=clang++ CCACHE_DIR=/tmp/loomwright-ccache CMAKE_BUILD_PARALLEL_LEVEL=2 LOOMWRIGHT_PACKAGE_OUT=/tmp/loomwright-artifacts "$GITHUB_WORKSPACE/scripts/package-arch.sh"
      - name: Install and smoke test Arch package
        run: |
          shopt -s nullglob
          packages=(/tmp/loomwright-artifacts/loomwright-*.pkg.tar.zst)
          [[ ${#packages[@]} -eq 1 ]] || { echo 'Expected exactly one Arch package' >&2; exit 1; }
          pacman -U --noconfirm "${packages[0]}"
          pacman -Q loomwright
          loomwright --version
          loomwright --check "$GITHUB_WORKSPACE/examples/two_spots.loom"
          ldd /usr/bin/loomwright | grep -q 'libgtk-3.so'
          test -f /usr/share/applications/io.github.noname_isaidnoname.loomwright.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/loomwright.svg
          test -f /usr/share/mime/packages/loomwright.xml
          test -x /usr/bin/loomwright-terminal
          desktop-file-validate /usr/share/applications/io.github.noname_isaidnoname.loomwright.desktop
          xdg-mime query default application/x-loomwright | grep -qx io.github.noname_isaidnoname.loomwright.desktop
      - uses: actions/upload-artifact@v7
        with:
          name: arch-package
          path: /tmp/loomwright-artifacts/*.pkg.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [build, arch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          name: arch-package
          path: artifacts
      - name: Verify and checksum assets
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cd artifacts
          for file in "loomwright-$VERSION-source.tar.gz" "loomwright-$VERSION-x86_64.tar.gz" "loomwright-$VERSION-x86_64.deb" "loomwright-$VERSION-x86_64.rpm" "loomwright-$VERSION-x86_64.AppImage"; do
            [[ -s "$file" ]] || { echo "Missing $file" >&2; exit 1; }
          done
          shopt -s nullglob
          arch=("loomwright-$VERSION"-*-x86_64.pkg.tar.zst)
          [[ ${#arch[@]} -eq 1 && -s ${arch[0]} ]] || { echo 'Expected one matching Arch package' >&2; exit 1; }
          files=(*)
          [[ ${#files[@]} -eq 6 ]] || { echo 'Expected exactly six release artifacts' >&2; exit 1; }
          sha256sum -- * > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          VERSION: ${{ needs.build.outputs.version }}
          DESCRIPTION: ${{ inputs.description }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          append_downloads() {
            printf '%s\n' '## Downloads' '' \
              '- Arch Linux: install the `.pkg.tar.zst` with `sudo pacman -U <package>`.' \
              '- Debian/Ubuntu: install the `.deb` with your package manager.' \
              '- RPM-based systems: install the `.rpm` with your package manager.' \
              '- Other supported systems: use the AppImage, binary tarball, or build from source.' \
              '- Verify downloads using `SHA256SUMS`.' >> /tmp/release-notes.md
            printf '\nSee the [README](https://github.com/%s#setup) for setup and permissions.\n' "$GH_REPO" >> /tmp/release-notes.md
          }
          if [[ "$EVENT" == schedule ]]; then
            # Only move the nightly tag after all artifacts have passed the build.
            if gh api "repos/$GH_REPO/git/ref/tags/nightly" >/dev/null 2>&1; then
              gh api -X PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="$SHA" -F force=true >/dev/null
            else
              gh api -X POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/nightly -f sha="$SHA" >/dev/null
            fi
            if gh release view nightly >/dev/null 2>&1; then gh release delete nightly --yes; fi
            printf 'Automated build of `%s` (version %s).\n\n**Nightly builds may be untested. Use at your own risk.**\n\n' "$SHA" "$VERSION" > /tmp/release-notes.md
            append_downloads
            gh release create nightly artifacts/* --title 'Nightly build' --notes-file /tmp/release-notes.md --prerelease --verify-tag
          else
            # Never overwrite an existing release or tag with different code.
            if gh api "repos/$GH_REPO/git/ref/tags/v$VERSION" >/dev/null 2>&1 || gh release view "v$VERSION" >/dev/null 2>&1; then
              echo "Tag or release v$VERSION already exists" >&2; exit 1
            fi
            if [[ -n "$DESCRIPTION" ]]; then
              printf '%s\n\n' "$DESCRIPTION" > /tmp/release-notes.md
            else
              printf 'Loomwright %s for Linux.\n\n' "$VERSION" > /tmp/release-notes.md
            fi
            append_downloads
            printf '\nBuilt from commit `%s`.\n' "$SHA" >> /tmp/release-notes.md
            gh release create "v$VERSION" artifacts/* --target "$SHA" --title "Loomwright $VERSION" --notes-file /tmp/release-notes.md
          fi
